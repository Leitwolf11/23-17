name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze native C and C++
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Compile native code under the extractor
        run: |
          bazelisk --batch build --spawn_strategy=processwrapper-sandbox --nouse_action_cache \
            --noremote_accept_cached --noremote_upload_local_results --disk_cache= \
            //Sources/Game:23.17
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
