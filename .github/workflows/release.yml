name: Desktop prerelease
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Player-visible changes and compatibility notes in English
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: native-ci
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build and run unit tests
        run: bazelisk test //Tests/... //Sources/Game:23.17
      - name: Derive the release version
        id: version
        run: printf 'value=%s\n' "$(python3 Build/Version.py)" >> "$GITHUB_OUTPUT"
      - name: Build and verify the archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 Build/PackageDesktop.py bazel-bin/Sources/Game/23.17 \
            "23.17-linux-x86_64-$VERSION.zip" --version "$VERSION"
          unzip -q "23.17-linux-x86_64-$VERSION.zip" -d "$RUNNER_TEMP/23.17-package"
          game="$RUNNER_TEMP/23.17-package/23.17/23.17"
          test "$("$game" --version)" = "$VERSION"
          "$game" --verify-campaign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-package
          path: 23.17-linux-x86_64-*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-package
      - name: Publish the verified commit as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          for workflow in ci.yml codeql.yml; do
            result="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --branch main --commit "$GITHUB_SHA" --event push --limit 1 \
              --json conclusion --jq '.[0].conclusion // empty')"
            if [ "$result" != success ]; then
              echo "The push checks for $workflow must succeed before release."
              exit 1
            fi
          done
          notes_file="$(mktemp)"
          printf "%s\n\nCommit: \`%s\`\n" "$NOTES" "$GITHUB_SHA" > "$notes_file"
          gh release create "$VERSION" "23.17-linux-x86_64-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "23.17 $VERSION" --notes-file "$notes_file" --prerelease
